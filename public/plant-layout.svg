<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260">
  <!-- Assembly Line -->
  <rect x="20" y="20" width="160" height="100" rx="6" data-zone-id="z-assembly" fill="none" stroke="#4A8FA3" stroke-width="1.5"/>
  <text x="100" y="65" text-anchor="middle" font-family="system-ui" font-size="11" fill="#9BA3B8">Assembly</text>
  <text x="100" y="80" text-anchor="middle" font-family="system-ui" font-size="10" fill="#9BA3B8">Line</text>

  <!-- Welding Zone -->
  <rect x="200" y="20" width="140" height="100" rx="6" data-zone-id="z-welding" fill="none" stroke="#4A8FA3" stroke-width="1.5"/>
  <text x="270" y="65" text-anchor="middle" font-family="system-ui" font-size="11" fill="#9BA3B8">Welding</text>
  <text x="270" y="80" text-anchor="middle" font-family="system-ui" font-size="10" fill="#9BA3B8">Zone</text>

  <!-- Chemical Zone -->
  <rect x="360" y="20" width="120" height="100" rx="6" data-zone-id="z-chemical" fill="none" stroke="#4A8FA3" stroke-width="1.5"/>
  <text x="420" y="65" text-anchor="middle" font-family="system-ui" font-size="11" fill="#9BA3B8">Chemical</text>
  <text x="420" y="80" text-anchor="middle" font-family="system-ui" font-size="10" fill="#9BA3B8">Zone</text>

  <!-- Storage Area -->
  <rect x="20" y="140" width="160" height="100" rx="6" data-zone-id="z-storage" fill="none" stroke="#4A8FA3" stroke-width="1.5"/>
  <text x="100" y="185" text-anchor="middle" font-family="system-ui" font-size="11" fill="#9BA3B8">Storage</text>
  <text x="100" y="200" text-anchor="middle" font-family="system-ui" font-size="10" fill="#9BA3B8">Area</text>

  <!-- Loading Bay -->
  <rect x="200" y="140" width="140" height="100" rx="6" data-zone-id="z-loading" fill="none" stroke="#4A8FA3" stroke-width="1.5"/>
  <text x="270" y="185" text-anchor="middle" font-family="system-ui" font-size="11" fill="#9BA3B8">Loading</text>
  <text x="270" y="200" text-anchor="middle" font-family="system-ui" font-size="10" fill="#9BA3B8">Bay</text>

  <!-- Maintenance Workshop -->
  <rect x="360" y="140" width="120" height="100" rx="6" data-zone-id="z-maintenance" fill="none" stroke="#4A8FA3" stroke-width="1.5"/>
  <text x="420" y="185" text-anchor="middle" font-family="system-ui" font-size="11" fill="#9BA3B8">Maintenance</text>
  <text x="420" y="200" text-anchor="middle" font-family="system-ui" font-size="10" fill="#9BA3B8">Workshop</text>
</svg>
